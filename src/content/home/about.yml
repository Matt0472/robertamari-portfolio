label: Chi sono
title: Ciao, sono *Roberta*
photo: /images/roberta-sorriso.jpg
photo_alt: Roberta Mari seduta all'aperto, sorridente
bio: |-
  Sono nata e cresciuta a Milano, con il cuore sempre rivolto al mare. Dopo la laurea in Scienze Politiche ho fatto tanti lavori diversi: ho servito ai tavoli di diversi ristoranti, ho lavorato per DHL e ho vissuto per circa un anno in Australia. Ogni esperienza mi ha insegnato qualcosa sulle persone.

  Al mio ritorno ho insegnato in una scuola statale e ho lavorato in un centro diurno. Dopo la nascita del mio secondo figlio ho scelto di dedicarmi a ciò che sentivo davvero mio e ho conseguito un master in Mindfulness, pensiero positivo ed educazione emozionale. Intanto gli albi illustrati, letti insieme ai miei figli, sono diventati una grande passione.

  Nel 2025, con un gruppo di famiglie, ho fondato una comunità educante. Da lì è nato «Il richiamo delle lanterne» e, oggi, il desiderio di portarne il messaggio nelle scuole, nelle biblioteche e ovunque ci siano bambini pronti ad ascoltare.
path_title: Il mio *percorso*
