text: >-
  «Il richiamo delle lanterne» ha ricevuto il Premio speciale Favole alla decima
  edizione del Premio Letterario Milano International, promosso dall'Associazione
  Culturale Pegasus Cattolica. Un riconoscimento che mi emoziona e che mi dà ancora
  più voglia di portare questa storia tra i bambini.
